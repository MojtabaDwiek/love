<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"> <!-- Love-themed font -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Counter Section -->
    <div class="counter">
      <h1>We've Been Together For:</h1>
      <div id="time-together">
        <span id="days">0</span> Days
        <span id="hours">0</span> Hours
        <span id="minutes">0</span> Minutes
        <span id="seconds">0</span> Seconds
      </div>
    </div>

    <!-- Animated Scene -->
    <div class="scene">
      <div class="rain"></div>
      <div class="umbrella-couple">
        <div class="text-left">No matter what happens
            and how hard it <span class="dark-blue">Rains</span>
        </div> <!-- Left text -->
        <img src="images/umbrella-couple.jpg" alt="Couple with Umbrella">
        <div class="text-right">I'll always be your <span class="dark-red">Umbrella</span></div> <!-- Right text -->
      </div>
    </div>
  </div>

  <!-- Add Music Player (Initially muted, autoplay) -->
  <audio id="background-music" autoplay loop muted>
    <source src="music/love-song.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <!-- Script to unmute after user interaction -->
  <script>
    // Wait for any user interaction to unmute and start the music
    document.body.addEventListener('click', function() {
      const audio = document.getElementById('background-music');
      audio.muted = false; // Unmute the audio after the user clicks
      audio.play(); // Ensure it starts playing after unmuting
    });

    // Optional: You can also listen for keyboard events (e.g., spacebar or enter key) to trigger unmuting
    document.body.addEventListener('keydown', function(e) {
      if (e.key === " " || e.key === "Enter") {
        const audio = document.getElementById('background-music');
        audio.muted = false; // Unmute the audio when user presses space or enter
        audio.play(); // Ensure it starts playing after unmuting
      }
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
